version: "3.8"

services:
  vulnerable-web:
    image: nginx:alpine
    container_name: vulnerable-nginx
    depends_on:
      - insecure-db
      - app
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    user: "nginx"
    read_only: true
    security_opt:
      - no-new-privileges:true

  insecure-db:
    image: postgres:16-alpine
    container_name: insecure-db
    environment:
      POSTGRES_DB: vulnapp
      POSTGRES_USER: vulnuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    # Не публикуем порт БД наружу (доступен в сети docker)
    # Если нужно подключаться с хоста: "127.0.0.1:5432:5432"
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  app:
    image: python:3.11-alpine
    container_name: vulnerable-app
    depends_on:
      - insecure-db
    working_dir: /app
    volumes:
      - ./app:/app:ro
    command: ["python", "app.py"]
    environment:
      DEBUG: "false"
      DB_HOST: insecure-db
      DB_PORT: "5432"
      DB_NAME: vulnapp
      DB_USER: vulnuser
    secrets:
      - db_password
      - app_secret_key
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5001:5000"

volumes:
  dbdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  app_secret_key:
    file: ./secrets/app_secret_key.txt
